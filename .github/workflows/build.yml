name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore WinYouTubeMusic.csproj

      - name: Build project
        run: dotnet build WinYouTubeMusic.csproj -c Release --no-restore

      - name: Publish application
        run: dotnet publish WinYouTubeMusic.csproj -c Release -r win-x64 --no-self-contained -o ./publish

      - name: Compress publish artifacts
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath WinYouTubeMusic-win-x64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: WinYouTubeMusic-win-x64
          path: WinYouTubeMusic-win-x64.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v6
        with:
          name: WinYouTubeMusic-win-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: WinYouTubeMusic-win-x64.zip
          generate_release_notes: true
